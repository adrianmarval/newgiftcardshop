services:
  database:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '5444:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-username}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-default_database}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
